name: Build Tiril APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies & build full web game
        run: |
          npm ci || npm install
          npm run build
          mkdir -p android/app/src/main/assets/web
          cp -r dist/* android/app/src/main/assets/web/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          echo "=== APK OUTPUT ==="
          find android/app/build/outputs/apk -type f -name "*.apk" -print
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Tiril.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tiril-debug-apk
          path: Tiril.apk
          if-no-files-found: error
          retention-days: 30
